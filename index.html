<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLS League</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Hero Section -->
    <header class="hero">
        <div class="container">
            <h1>DLS League</h1>
            <p>Register your team, check fixtures, and track live standings!</p>
            <!-- Replace the href below with your actual WhatsApp Group Link -->
            <a href="https://chat.whatsapp.com/BmmbnRqv9vY8Gu9NescqUC?s=cl&p=a&mlu=0" target="_blank" class="cta-btn">
                <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp" class="wa-icon">
                Join WhatsApp to Register Team
            </a>
        </div>
    </header>

    <main class="container">
        
        <!-- Stats Overview Cards -->
        <section class="section">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Matches Played</h3>
                    <p id="stat-matches" class="stat-number">0</p>
                </div>
                <div class="stat-card">
                    <h3>Total Goals</h3>
                    <p id="stat-goals" class="stat-number">0</p>
                </div>
                <div class="stat-card highlight-card">
                    <h3>League Leader 🏆</h3>
                    <p id="stat-leader" class="stat-text">-</p>
                </div>
            </div>
        </section>

        <!-- Standings Section -->
        <section class="section">
            <h2>League Table</h2>
            <div class="table-wrapper">
                <table id="league-table">
                    <thead>
                        <tr>
                            <th>Pos</th>
                            <th>Team</th>
                            <th>P</th>
                            <th>W</th>
                            <th>D</th>
                            <th>L</th>
                            <th>GD</th>
                            <th>Pts</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Populated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Fixtures & Results Section -->
        <section class="section">
            <h2>Fixtures & Results</h2>
            
            <!-- Team Search Filter Bar -->
            <div class="search-container">
                <input 
                    type="text" 
                    id="team-search" 
                    placeholder="Search for a team to view their matches..." 
                    onkeyup="filterFixtures()"
                >
            </div>

            <div id="fixtures-container" class="fixtures-grid">
                <!-- Populated by JavaScript -->
            </div>
        </section>
    </main>

    <!-- Load Data and Main Script -->
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
